openapi: 3.1.0
info:
  title: Coire compatible gateway contract
  version: 0.1.0
paths:
  /v1/models:
    get:
      operationId: listCompatibleModels
      responses:
        '200':
          description: Visible ready models
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelList'}
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChatRequest'}
      responses:
        '200':
          description: JSON completion or text/event-stream chunks when stream is true
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/messages:
    post:
      operationId: createAnthropicMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnthropicRequest'}
      responses:
        '200':
          description: JSON message or Anthropic SSE event sequence when stream is true
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Model:
      type: object
      required: [id, object, created, owned_by, coire_load_state, coire_tags]
      properties:
        id: {type: string, format: uuid}
        object: {const: model}
        created: {type: integer}
        owned_by: {const: coire}
        coire_load_state: {type: string, enum: [loaded, loading, cold]}
        coire_tags: {type: array, items: {type: string}}
        coire_description: {type: [string, 'null']}
        coire_context_window: {type: [integer, 'null'], minimum: 1}
      additionalProperties: false
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: {const: list}
        data: {type: array, items: {$ref: '#/components/schemas/Model'}}
      additionalProperties: false
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [system, user, assistant, tool]}
        content: {type: [string, 'null']}
        name: {type: string}
        tool_call_id: {type: string}
      additionalProperties: true
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: {type: string, format: uuid}
        messages: {type: array, minItems: 1, items: {$ref: '#/components/schemas/ChatMessage'}}
        stream: {type: boolean, default: false}
        max_tokens: {type: integer, minimum: 1}
        temperature: {type: number, minimum: 0}
        top_p: {type: number, minimum: 0, maximum: 1}
        stop: {oneOf: [{type: string}, {type: array, items: {type: string}}]}
        tools: {type: array, items: {type: object, additionalProperties: true}}
        tool_choice: {}
        response_format: {type: object, additionalProperties: true}
        coire_wait_for_model: {type: boolean, default: true}
      additionalProperties: false
    AnthropicMessage:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant]}
        content:
          oneOf:
            - {type: string}
            - {type: array, items: {type: object, additionalProperties: true}}
      additionalProperties: false
    AnthropicRequest:
      type: object
      required: [model, max_tokens, messages]
      properties:
        model: {type: string, format: uuid}
        max_tokens: {type: integer, minimum: 1}
        messages: {type: array, minItems: 1, items: {$ref: '#/components/schemas/AnthropicMessage'}}
        system: {oneOf: [{type: string}, {type: array, items: {type: object}}]}
        stream: {type: boolean, default: false}
        temperature: {type: number, minimum: 0}
        top_p: {type: number, minimum: 0, maximum: 1}
        stop_sequences: {type: array, items: {type: string}}
        tools: {type: array, items: {type: object, additionalProperties: true}}
        tool_choice: {type: object, additionalProperties: true}
        coire_wait_for_model: {type: boolean, default: true}
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
      additionalProperties: true

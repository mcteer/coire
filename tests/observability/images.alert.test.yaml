rule_files:
  - /rules/image.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'coire_image_observation_total{outcome="revoked"}'
        values: '0 0 1 1 1 1 1 1'
      - series: 'coire_image_cancellation_recovery_total{outcome="failed"}'
        values: '0 0 1 1 1 1 1 1'
      - series: 'coire_image_node_stages_total{stage="classify",outcome="failed"}'
        values: '0 0 1 1 1 1 1 1'
      - series: 'coire_image_purge_total{kind="output",outcome="failed"}'
        values: '0 0 1 1 1 1 1 1'
      - series: 'coire_image_purge_oldest_seconds'
        values: '0 86401 86401 86401 86401 86401 86401 86401'
    alert_rule_test:
      - eval_time: 3m
        alertname: CoireImageAuthorizationRevocations
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: A running image job lost authorization and cancellation was requested}
      - eval_time: 3m
        alertname: CoireImageCancellationRecoveryFailures
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: A fenced image cancellation could not be reconciled}
      - eval_time: 3m
        alertname: CoireImageClassifierFailures
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: Studio image classification failed and outputs need unknown-tag review}
      - eval_time: 3m
        alertname: CoireImageOutputCleanupFailures
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: Private image output cleanup failed}
      - eval_time: 7m
        alertname: CoireImagePurgeOverdue
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: Private image blobs are past the 24-hour purge deadline}
  - interval: 1m
    input_series:
      - series: 'coire_image_observation_total{outcome="active"}'
        values: '0 1 2 3 4 5 6 7'
      - series: 'coire_image_cancellation_recovery_total{outcome="cancelled"}'
        values: '0 1 2 3 4 5 6 7'
      - series: 'coire_image_node_stages_total{stage="classify",outcome="succeeded"}'
        values: '0 1 2 3 4 5 6 7'
      - series: 'coire_image_purge_oldest_seconds'
        values: '0 0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 7m
        alertname: CoireImageAuthorizationRevocations
        exp_alerts: []
      - eval_time: 7m
        alertname: CoireImageCancellationRecoveryFailures
        exp_alerts: []
      - eval_time: 7m
        alertname: CoireImageClassifierFailures
        exp_alerts: []
      - eval_time: 7m
        alertname: CoireImagePurgeOverdue
        exp_alerts: []

  - series: coire_upgrades_enabled
    values: 1+0x20
  - series: coire_upgrade_snapshot_timestamp_seconds
    values: 0+15x20
  - series: coire_upgrade_operations{kind="control_plane"}
    values: 0+0x20
  - series: coire_upgrade_executor_ready
    values: 1+0x20
  - series: coire_upgrade_executor_heartbeat_age_seconds
    values: 0+0x20
  - series: coire_upgrade_recovery_required{kind="control_plane"}
    values: 0+0x20
  - series: coire_upgrade_phase_age_seconds{kind="control_plane"}
    values: 0+0x20
  alert_rule_test:
  - eval_time: 1m
    alertname: CoireUpgradeBaselineUnavailable

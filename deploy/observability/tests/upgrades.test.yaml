  - series: coire_upgrade_executor_ready
    values: 0+0x20
  - series: coire_upgrade_executor_heartbeat_age_seconds
    values: 0+0x20
  - series: coire_upgrade_recovery_required{kind="control_plane"}
    values: 0+0x20
  - series: coire_upgrade_phase_age_seconds{kind="control_plane"}
    values: 0+0x20
  alert_rule_test:
  - eval_time: 1m
    alertname: CoireUpgradeExecutorUnavailable
    exp_alerts:
    - exp_labels: &id001
        severity: critical
        subject: upgrades
      exp_annotations: &id002
        summary: A retained Core operation has no fresh independent recovery executor
        runbook_url: /docs/runbooks/upgrades#recover
- name: CoireUpgradeExecutorUnavailable-healthy
  interval: 15s

- name: rebooted-staging-quarantine-retained
  interval: 15s
  input_series:
  - series: coire_upgrade_native_terminal_quarantined_bytes{node="coire-edge-a"}
    values: 1074360320 1074360320 1074360320
  alert_rule_test:
  - eval_time: 30s

# Isolated test receiver/exporter; never a production collector override.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: false
service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]

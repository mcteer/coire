groups:
  - name: coire-chat
    rules:
      - alert: CoireChatApiFailures
        expr: sum(increase(coire_chat_requests_total{outcome="failed"}[5m])) > 0
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: Native Chat API request failed
      - alert: CoireChatPurgeOverdue
        expr: max(coire_chat_purge_oldest_seconds) > 86400
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Deleted Chat content is past its 24-hour purge deadline

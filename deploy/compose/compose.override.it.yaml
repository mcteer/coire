# Integration-test overlay. NEVER used in production.
#
# Adds two node agents on a shared control network and a Studio-only data network.
# whole of feature 001 except the model load itself (research R9): registration with its
# mesh-subnet validation, acquisition, the mesh-only export path, engine lifecycle, and
# reconciliation after an agent restart.
#
# The addresses here are the real mesh addresses from deploy/cluster/hosts, on a compose
# network rather than a Thunderbolt bridge. That is deliberate: NodeRegistration refuses any
# address outside 192.168.100.0/24, so a made-up subnet would test a different code path than
# the one that runs on the cluster. This is the one place in the repository that writes an
# address (ADR-0002 governs *service config*, and this is a test harness) — production
# compose.yaml stays free of them, which tests/integration/test_topology.py asserts.
#
# `node-b` has the control attachment required by feature 022 and the Studio-only data
# attachment used for replication. It deliberately receives no Hugging Face credential: only
# the admin-selected origin may acquire externally, while the replica is populated over the
# internal data network.
#
#   docker compose -f compose.yaml -f compose.override.it.yaml up -d

services:
  coire-web:
    # Never collide with the production/local gateway on 8080.
    ports: !override ["127.0.0.1:${COIRE_IT_PORT:-18080}:8080"]

  coire-api:
    ports: ["127.0.0.1:${COIRE_IT_API_PORT:-18081}:8000"]
    environment:
      # Integration storage may be much smaller than a Studio's reserved 50 GiB; the
      # production default would refuse every fixture. The check itself has a focused test.
      DISK_RESERVE_BYTES: "268435456"
      REGISTRY_RECONCILE_INTERVAL_S: "2"
      GATEWAY_MAX_INFLIGHT_PER_ENGINE: "4"
      PLACEMENT_POLL_INTERVAL_S: "0.2"
      INSTANCE_DRAIN_TIMEOUT_S: "2"
    networks:
      coire-control-sim:
        aliases: [coire-core]

  coire-scheduler:
    environment:
      PLACEMENT_POLL_INTERVAL_S: "0.2"
      PLACEMENT_TTL_INTERVAL_S: "2"

  node-a:
    image: coire-node-test:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/coire-node/docker/node-test.Dockerfile
    networks:
      coire-control-sim:
        aliases: [coire-edge-a, "coire-edge-a.lab"]
      coire-data-sim:
        ipv4_address: 192.168.100.11
      # The origin needs egress to reach Hugging Face; it is the only container that does.
      coire-edge:
    extra_hosts:
      - "coire-edge-a.fabric:192.168.100.11"
      - "coire-edge-b.fabric:192.168.100.12"
    environment:
      NODE_NAME: coire-edge-a
      NODE_TOKEN: ${COIRE_IT_NODE_TOKEN_A:-a}
      CORE_CONTROL_HOST: coire-api
      NODE_CONTROL_HOST: coire-edge-a
      NODE_DATA_HOST: coire-edge-a.fabric
      MESH_HOSTS_FILE: /etc/hosts
      NODE_PROBE_INTERVAL_S: "2"
      NODE_ENGINE_HEALTH_INTERVAL_S: "2"
      # The overlay attaches coire-api to the mesh directly, so the node reaches uvicorn
      # rather than nginx. Production goes through nginx on 8080.
      CORE_API_PORT: "8000"
      REGISTRY_RECONCILE_INTERVAL_S: "2"
      # Selects the fake engine (research R9). The real one is Apple-Silicon only.
      COIRE_ENGINE_COMMAND: /app/.venv/bin/python:-m:coire_node.testing.fake_engine
      COIRE_TEST_FAKE_CONVERSION: "1"
      COIRE_TEST_FAKE_VALIDATION: "1"
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_DISABLE_XET: "1"
      DISK_RESERVE_BYTES: "268435456"
      OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      # Persistent across `docker compose restart`, like the Studio's /opt/coire volume.
      # The session fixture removes it with `down -v` after every integration run.
      - node-a-opt:/opt/coire
    healthcheck:
      # The agent binds its mesh address, not loopback, so the probe must use that address —
      # exactly as it does on a Studio.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://coire-edge-a:9400/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  node-b:
    image: coire-node-test:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/coire-node/docker/node-test.Dockerfile
    networks:
      # Control for registration/management, data for replication. Unlike node-a, this service
      # has no coire-edge attachment and receives no Hugging Face credential.
      coire-control-sim:
        aliases: [coire-edge-b, "coire-edge-b.lab"]
      coire-data-sim:
        ipv4_address: 192.168.100.12
    extra_hosts:
      - "coire-edge-a.fabric:192.168.100.11"
      - "coire-edge-b.fabric:192.168.100.12"
    environment:
      NODE_NAME: coire-edge-b
      NODE_TOKEN: ${COIRE_IT_NODE_TOKEN_B:-b}
      CORE_CONTROL_HOST: coire-api
      NODE_CONTROL_HOST: coire-edge-b
      NODE_DATA_HOST: coire-edge-b.fabric
      MESH_HOSTS_FILE: /etc/hosts
      NODE_PROBE_INTERVAL_S: "2"
      NODE_ENGINE_HEALTH_INTERVAL_S: "2"
      # The overlay attaches coire-api to the mesh directly, so the node reaches uvicorn
      # rather than nginx. Production goes through nginx on 8080.
      CORE_API_PORT: "8000"
      REGISTRY_RECONCILE_INTERVAL_S: "2"
      COIRE_ENGINE_COMMAND: /app/.venv/bin/python:-m:coire_node.testing.fake_engine
      COIRE_TEST_FAKE_CONVERSION: "1"
      COIRE_TEST_FAKE_VALIDATION: "1"
      HF_HUB_DISABLE_XET: "1"
      DISK_RESERVE_BYTES: "268435456"
      OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - node-b-opt:/opt/coire
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://coire-edge-b:9400/ready"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  coire-control-sim:
  coire-data-sim:
    internal: true
    ipam:
      config:
        - subnet: 192.168.100.0/24

volumes:
  node-a-opt:
  node-b-opt:

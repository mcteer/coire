# OpenTelemetry Collector — feature 000.
#
# Export only (FR-014). Everything stays local and nothing egresses. The metrics, logs and
# traces backends, the dashboards and the alert rules are feature 009 (ADR-0003), at which
# point exporters are added here rather than instrumentation being retrofitted everywhere.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  # Until feature 009 provides Tempo/Prometheus/Loki, spans and metrics are counted and
  # dropped. `basic` keeps one line per batch so the quickstart can assert arrival without
  # filling core's disk.
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

server: {http_listen_port: 3200}
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
        http: {endpoint: 0.0.0.0:4318}
storage:
  trace:
    backend: local
    local: {path: /var/tempo/blocks}
    wal: {path: /var/tempo/wal}
compactor:
  compaction:
    block_retention: ${COIRE_TRACE_RETENTION:-168h}
overrides:
  defaults:
    ingestion:
      rate_strategy: local
      rate_limit_bytes: ${COIRE_TRACE_INGESTION_BPS:-50000}
      burst_size_bytes: 1000000

route:
  receiver: local-operator
  group_by: [alertname, cluster, subject]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: local-operator
inhibit_rules:
  - source_matchers: ['alertname="CoireNodeUnreachable"']
    target_matchers: ['alertname=~"CoireNodeDegraded|CoireNodeSaturation"']
    equal: [subject]

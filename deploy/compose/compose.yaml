# Coire control plane — the whole of it, on core.
#
# The project is named explicitly: without this, compose derives it from the directory
# ("compose"), which makes every container `compose-*` and reads as nothing in `docker ps`.
#
# Brought up by ./coire-up, which sources secrets from the macOS Keychain into its own
# environment and never writes them to disk (FR-011, research R4).
#
# Networks are per concern, not one flat bridge: a container is attached only to the networks
# its role requires, so coire-web cannot reach Postgres and only coire-scheduler can reach the
# Docker socket proxy (FR-006, FR-007).
#
# Absent by design: cloudflared (no tunnel until the platform faces external traffic —
# ADR-0001), coire-agent (the user harness is built but never run on core — FR-017), and
# the observability backends (feature 009 — ADR-0003).

name: coire

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 5s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-python-health: &python-health
  interval: 20s
  timeout: 2s
  retries: 3
  start_period: 10s

services:
  # ---------------------------------------------------------------- ingress
  coire-web:
    image: ${COIRE_REGISTRY:-}coire-web:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/coire-web/Dockerfile
    # The ONLY published port in feature 000, and only on loopback: nothing on core is
    # reachable from the LAN. Public exposure arrives with feature 007 (ADR-0001).
    ports: ["${COIRE_CONTROL_BIND_ADDRESS:-127.0.0.1}:${COIRE_CONTROL_PORT:-8180}:8080"]
    networks: [coire-edge, coire-telemetry]
    depends_on:
      coire-api: {condition: service_healthy}
    <<: *hardening
    # Declared explicitly rather than inherited from the image, so the topology test can
    # assert it and a base-image change cannot silently promote this container to root.
    user: "65532:65532"
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.5"
    healthcheck:
      # Local, non-proxied path: probing /ready would reach coire-api, so an api restart
      # would mark web unhealthy and break restart isolation (SC-002).
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/nginx-health"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 2s

  # ---------------------------------------------------------------- control plane
  coire-api:
    image: ${COIRE_REGISTRY:-}coire-api:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/coire-api/docker/api.Dockerfile
    networks: [coire-edge, coire-db, coire-internal, coire-telemetry]
    environment:
      POSTGRES_HOST: postgres
      OTLP_ENDPOINT: http://otel-collector:4317
      MCP_ENABLED: ${COIRE_MCP_ENABLED:-false}
      MCP_SOURCE_HOSTS: ${COIRE_MCP_SOURCE_HOSTS:-github.com}
      OPS_ENABLED: ${COIRE_OPS_ENABLED:-false}
      DIAGNOSTICS_ENABLED: ${COIRE_DIAGNOSTICS_ENABLED:-false}
      CLOUDFLARE_ACCESS_ISSUER: ${CLOUDFLARE_ACCESS_ISSUER:-}
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:-}
      NODE_INVENTORY_FILE: /app/nodes.yaml
      SHARDING_JACCL_HOSTFILE: /run/coire/cluster/jaccl-hostfile.json
      SHARDING_RING_HOSTFILE: /run/coire/cluster/ring-hostfile.json
      RUN_AGENT_IMAGE: ${COIRE_RUN_AGENT_IMAGE:-}
      RUN_RELAY_IMAGE: ${COIRE_RUN_RELAY_IMAGE:-}
      OPS_SERVICE_URL: http://coire-ops:8003
      OPS_SESSION_STALE_S: ${OPS_SESSION_STALE_S:-30}
      FAILOVER_MEMBER_NAME: ${COIRE_FAILOVER_MEMBER_NAME:-}
      FAILOVER_CORE_PUBLIC_KEY: ${COIRE_FAILOVER_CORE_PUBLIC_KEY:-}
      FAILOVER_EDGE_A_PUBLIC_KEY: ${COIRE_FAILOVER_EDGE_A_PUBLIC_KEY:-}
      FAILOVER_EDGE_B_PUBLIC_KEY: ${COIRE_FAILOVER_EDGE_B_PUBLIC_KEY:-}
    volumes: ["${COIRE_CLUSTER_CONFIG_DIR:-../cluster/generated}:/run/coire/cluster:ro"]
    secrets: [postgres_password, key_signing_secret, node_tokens, admin_token, bootstrap_admin_email, ops_service_token, failover_peer_key]
    depends_on:
      postgres: {condition: service_healthy}
      coire-migrate: {condition: service_completed_successfully}
    <<: *hardening
    tmpfs: [/tmp, /opt/coire/failover]
    user: "65532:65532"
    pids_limit: 256
    mem_limit: 1g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8000/ready"]
      <<: *python-health

  # Studio-only. Enable with `--profile studio-failover` on a Studio, never on core.
  # /ready stays election-gated, so the healthcheck only checks that the process is listening.
  coire-failover:
    profiles: ["studio-failover"]
    container_name: coire-failover
    image: ${COIRE_FAILOVER_IMAGE:-coire-failover:dev}
    build:
      context: ../..
      dockerfile: apps/coire-failover/Dockerfile
    ports: ["127.0.0.1:8004:8004"]
    networks: [coire-edge]
    environment:
      OTLP_ENDPOINT: http://otel-collector:4317
      FAILOVER_SNAPSHOT_PATH: /opt/coire/failover/snapshot.json
      FAILOVER_PROOF_PATH: /opt/coire/failover/proof.json
      FAILOVER_CORE_PUBLIC_KEY: ${COIRE_FAILOVER_CORE_PUBLIC_KEY:-}
      FAILOVER_LOCAL_RELAY_URL: ${COIRE_FAILOVER_LOCAL_RELAY_URL:-}
      FAILOVER_PEER_RELAY_URL: ${COIRE_FAILOVER_PEER_RELAY_URL:-}
    volumes: ["/opt/coire/failover:/opt/coire/failover:ro"]
    secrets: [failover_relay_token]
    <<: *hardening
    restart: "no"
    user: "65532:65532"
    pids_limit: 64
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8004),2); s.close()"]
      <<: *python-health

  coire-ops:
    profiles: ["ops"]
    image: ${COIRE_REGISTRY:-}coire-agent-ops:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/coire-agent/ops.Dockerfile
    networks: [coire-internal, coire-telemetry]
    environment:
      OTLP_ENDPOINT: http://otel-collector:4317
      OPS_API_URL: http://coire-api:8000
      OPS_GATEWAY_URL: http://coire-api:8000/v1
      OPS_MODEL_ID: ${COIRE_OPS_MODEL_ID:-}
      OPS_SERVICE_INSTANCE: coire-ops
    secrets: [ops_service_token]
    depends_on:
      coire-api: {condition: service_healthy}
    <<: *hardening
    user: "65532:65532"
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8003/ready"]
      <<: *python-health

  coire-mcp:
    profiles: ["mcp"]
    image: ${COIRE_REGISTRY:-}coire-mcp:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/coire-api/docker/mcp.Dockerfile
    networks: [coire-edge, coire-db, coire-telemetry]
    environment:
      OTLP_ENDPOINT: http://otel-collector:4317
      POSTGRES_HOST: postgres
      CLOUDFLARE_ACCESS_ISSUER: ${CLOUDFLARE_ACCESS_ISSUER:-}
      CLOUDFLARE_ACCESS_AUDIENCE: ${CLOUDFLARE_ACCESS_AUDIENCE:-}
    secrets: [postgres_password]
    depends_on:
      postgres: {condition: service_healthy}
      coire-migrate: {condition: service_completed_successfully}
    <<: *hardening
    user: "65532:65532"
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8001/ready"]
      <<: *python-health

  coire-scheduler:
    image: ${COIRE_REGISTRY:-}coire-scheduler:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/coire-api/docker/scheduler.Dockerfile
    # The only service on coire-docker, and it reaches the socket solely through the proxy.
    networks: [coire-edge, coire-db, coire-internal, coire-docker, coire-telemetry]
    environment:
      POSTGRES_HOST: postgres
      OTLP_ENDPOINT: http://otel-collector:4317
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SHARDING_JACCL_HOSTFILE: /run/coire/cluster/jaccl-hostfile.json
      SHARDING_RING_HOSTFILE: /run/coire/cluster/ring-hostfile.json
      RUN_AGENT_IMAGE: ${COIRE_RUN_AGENT_IMAGE:-}
      RUN_RELAY_IMAGE: ${COIRE_RUN_RELAY_IMAGE:-}
      RUN_GATEWAY_URL: ${RUN_GATEWAY_URL:-http://coire-core.lab:8080/v1}
      MCP_SOURCE_HOSTS: ${COIRE_MCP_SOURCE_HOSTS:-github.com}
      MCP_ARTIFACT_RETENTION_HOURS: ${COIRE_MCP_ARTIFACT_RETENTION_HOURS:-168}
    volumes: ["${COIRE_CLUSTER_CONFIG_DIR:-../cluster/generated}:/run/coire/cluster:ro"]
    secrets: [postgres_password, node_tokens]
    depends_on:
      postgres: {condition: service_healthy}
    <<: *hardening
    user: "65532:65532"
    pids_limit: 256
    mem_limit: 1536m
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8002/ready"]
      <<: *python-health

  coire-migrate:
    image: ${COIRE_REGISTRY:-}coire-migrate:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: apps/coire-api/docker/migrate.Dockerfile
    # One-shot: runs to completion and exits 0. Migrations never run inside a long-lived
    # service (FR-010), and coire-api waits on service_completed_successfully.
    networks: [coire-db, coire-telemetry]
    environment:
      POSTGRES_HOST: postgres
    secrets: [postgres_password]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    restart: "no"
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"

  # ---------------------------------------------------------------- stateful
  postgres:
    image: docker.io/library/postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    networks: [coire-db]
    environment:
      POSTGRES_USER: coire
      POSTGRES_DB: coire
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [postgres_password]
    volumes: [coire-pgdata:/var/lib/postgresql/data]
    # Hardened as far as the upstream image supports. Its shell is accepted: the constitution
    # pins Postgres 17 and no shell-less, version-pinnable Postgres 17 image exists
    # (research R3; FR-004 as amended). It is reachable only on coire-db.
    read_only: true
    tmpfs: [/tmp, /run/postgresql, /var/run/postgresql]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 2g
    cpus: "2.0"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coire -d coire"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------- infrastructure
  docker-socket-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    networks: [coire-docker]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    environment:
      # Explicit allowlist. Everything not named here is denied, and the proxy exists so the
      # scheduler manages the control plane's own containers without holding the raw socket.
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "1"
      NETWORKS: "0"
      VOLUMES: "0"
      SERVICES: "0"
      TASKS: "0"
      SWARM: "0"
      SECRETS: "0"
      CONFIGS: "0"
      NODES: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      INFO: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      SESSION: "0"
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 96m
    cpus: "0.5"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  otel-collector:
    image: ${COIRE_REGISTRY:-}coire-otel:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/compose/otel.Dockerfile
    command: ["--config", "/etc/otelcol-contrib/${COIRE_OTEL_CONFIG:-config.yaml}"]
    # `coire-node-ingress` exists solely to make the host-published OTLP socket routable.
    # OrbStack does not create host forwards for a container attached only to internal
    # networks. The collector retains its separate internal telemetry attachment for services.
    networks: [coire-telemetry, coire-node-ingress]
    ports: ["${COIRE_CONTROL_BIND_ADDRESS:-127.0.0.1}:4317:4317"]
    # Nothing depends_on the collector: telemetry loss must never cause a request failure.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 384m
    cpus: "1.0"
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:13133/"]
      interval: 20s
      timeout: 2s
      retries: 3
      start_period: 5s

  prometheus:
    image: ${COIRE_REGISTRY:-}coire-prometheus:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/compose/prometheus.Dockerfile
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=${COIRE_METRIC_RETENTION:-48h}", "--storage.tsdb.retention.size=${COIRE_METRIC_RETENTION_SIZE:-2GB}"]
    networks: [coire-telemetry]
    volumes: [coire-prometheus:/prometheus]
    user: "65534:65534"
    <<: *hardening
    pids_limit: 64
    mem_limit: 384m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:9090/-/ready"]
      interval: 20s
      timeout: 2s
      retries: 3

  alertmanager:
    image: ${COIRE_REGISTRY:-}coire-alertmanager:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/compose/alertmanager.Dockerfile
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    networks: [coire-telemetry]
    volumes: [coire-alertmanager:/alertmanager]
    user: "65534:65534"
    <<: *hardening
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:9093/-/ready"]
      interval: 20s
      timeout: 2s
      retries: 3

  loki:
    profiles: ["diagnostics"]
    image: ${COIRE_REGISTRY:-}coire-loki:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/compose/loki.Dockerfile
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    environment:
      COIRE_LOG_RETENTION: ${COIRE_LOG_RETENTION:-48h}
      COIRE_LOG_INGESTION_MBPS: ${COIRE_LOG_INGESTION_MBPS:-0.05}
    networks: [coire-telemetry]
    volumes: [coire-loki:/loki]
    user: "10001:10001"
    <<: *hardening
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:3100/ready"]
      interval: 20s
      timeout: 2s
      retries: 3

  tempo:
    profiles: ["diagnostics"]
    image: ${COIRE_REGISTRY:-}coire-tempo:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/compose/tempo.Dockerfile
    command: ["-config.file=/etc/tempo/tempo.yml", "-config.expand-env=true"]
    environment:
      COIRE_TRACE_RETENTION: ${COIRE_TRACE_RETENTION:-48h}
      COIRE_TRACE_INGESTION_BPS: ${COIRE_TRACE_INGESTION_BPS:-50000}
    networks: [coire-telemetry]
    volumes: [coire-tempo:/var/tempo]
    user: "10001:10001"
    <<: *hardening
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:3200/ready"]
      interval: 20s
      timeout: 2s
      retries: 3

  grafana:
    profiles: ["diagnostics"]
    image: ${COIRE_REGISTRY:-}coire-grafana:${COIRE_TAG:-dev}
    build:
      context: ../..
      dockerfile: deploy/compose/grafana.Dockerfile
    networks: [coire-telemetry]
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin_token
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /var/lib/grafana/log
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins
    volumes: [coire-grafana:/var/lib/grafana]
    secrets: [admin_token]
    user: "472:472"
    <<: *hardening
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 2s
      retries: 3

networks:
  # Only coire-edge is non-internal: it is where cloudflared attaches in feature 007. Even so,
  # nothing is published from it in feature 000 except coire-web on loopback.
  coire-edge:
    internal: false
  coire-db:
    internal: true
  coire-internal:
    internal: true
  coire-docker:
    internal: true
  coire-telemetry:
    internal: true
  coire-node-ingress:
    internal: false

volumes:
  coire-pgdata:
  coire-prometheus:
  coire-alertmanager:
  coire-loki:
  coire-tempo:
  coire-grafana:

secrets:
  # File-sourced from a 0700 directory outside the repository, written by coire-up from the
  # Keychain and removed by coire-down. The files themselves are 0644: a compose file-secret is
  # a bind mount that preserves host ownership, so a 0600 file is unreadable to a container
  # running as uid 65532 on Linux. Confidentiality is the directory's job.
  #
  # Two measured constraints force exactly this shape (research R4, amended):
  #   * `environment:` sources are rejected outright for any service with read_only: true
  #     ("`file` is the sole supported option"), and every first-party service is read-only.
  #   * A file source is a bind mount, so DELETING it after bring-up makes /run/secrets/<name>
  #     vanish from the running container and breaks `docker compose restart`. The file must
  #     therefore live for the lifetime of the stack, not be deleted immediately.
  #
  # The secret is never in the repository or an image. The Studio relay credential is
  # materialized on its Studio by coire-studio-failover-create.
  postgres_password:
    file: ${COIRE_SECRETS_DIR}/postgres_password
  key_signing_secret:
    file: ${COIRE_SECRETS_DIR}/key_signing_secret
  node_tokens:
    file: ${COIRE_SECRETS_DIR}/node_tokens
  # The interim admin bearer (ADR-0004). Mounted on coire-api alone: no other service makes
  # an authorisation decision, and a secret is only as confined as its narrowest mount.
  admin_token:
    file: ${COIRE_SECRETS_DIR}/admin_token
  bootstrap_admin_email:
    file: ${COIRE_SECRETS_DIR}/bootstrap_admin_email
  ops_service_token:
    file: ${COIRE_SECRETS_DIR}/ops_service_token
  failover_relay_token:
    file: ${COIRE_SECRETS_DIR}/failover_relay_token
  failover_peer_key:
    file: ${COIRE_SECRETS_DIR}/failover_peer_key

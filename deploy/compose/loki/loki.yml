auth_enabled: false
server: {http_listen_port: 3100}
common:
  path_prefix: /loki
  replication_factor: 1
  ring: {kvstore: {store: inmemory}}
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
storage_config:
  filesystem: {directory: /loki/chunks}
  tsdb_shipper: {active_index_directory: /loki/index, cache_location: /loki/index-cache}
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  retention_period: ${COIRE_LOG_RETENTION:-168h}
  max_query_lookback: ${COIRE_LOG_RETENTION:-168h}
  ingestion_rate_mb: ${COIRE_LOG_INGESTION_MBPS:-0.05}
  ingestion_burst_size_mb: 1
  allow_structured_metadata: true

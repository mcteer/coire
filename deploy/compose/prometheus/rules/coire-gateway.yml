groups:
  - name: coire-gateway
    rules:
      - alert: CoireGatewayEngineFailures
        expr: sum(rate(coire_gateway_failures_total{failure_code=~"engine.*"}[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Coire gateway engine failures are sustained
          description: More than 0.05 engine failures per second have persisted for ten minutes.
      - alert: CoireGatewaySaturated
        expr: sum(rate(coire_gateway_requests_total{outcome="refused",failure_code="engine_saturated"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Coire gateway is refusing saturated-engine traffic
          description: At least one model engine has remained saturated for five minutes.
      - alert: CoireGatewayOverheadHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(coire_gateway_overhead_duration_ms_bucket[5m]))) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Coire gateway p95 overhead exceeds 20 ms
          description: Gateway processing excluding the upstream engine interval has exceeded its SLO for ten minutes.
      - alert: CoireGatewayQueueDelayHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(coire_gateway_queue_duration_ms_bucket{outcome="admitted"}[5m]))) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Coire gateway engine admission delay is high
          description: Gateway engine-slot admission p95 has exceeded 100 ms for ten minutes.

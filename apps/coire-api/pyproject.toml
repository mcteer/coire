[project]
name = "coire-api"
version = "0.1.0"
description = "Coire control plane: gateway, admin API, and the MCP/scheduler stubs."
requires-python = "==3.13.*"
dependencies = [
    "coire-core",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_api", "src/coire_mcp", "src/coire_scheduler"]

[project]
name = "coire-api"
version = "0.1.0"
description = "Coire control plane: gateway, admin API, and the MCP/scheduler stubs."
requires-python = "==3.13.*"
dependencies = [
    "coire-core",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # The [asyncio] extra, not bare sqlalchemy: it forces `greenlet`, which the async engine
    # requires at runtime. SQLAlchemy's own conditional dependency lists platform_machine
    # 'aarch64' but not 'arm64', so bare sqlalchemy installs greenlet inside the Linux arm64
    # container and NOT on macOS arm64 - the API worked in compose while alembic and every
    # async DB call failed on a Mac with "the greenlet library is required".
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    # MIT. Verify Cloudflare Access signatures/claims against configured JWKS (spec 007 R1).
    "PyJWT[crypto]==2.13.0",
    # MIT. Memory-hard Argon2id hashes for one-time API-key secrets (spec 007 R2).
    "argon2-cffi==25.1.0",
    # MIT. Durable acquisition stages and restart recovery; scheduler-only (spec 002 R1).
    "dbos==2.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_api", "src/coire_mcp", "src/coire_scheduler"]

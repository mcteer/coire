[project]
name = "coire-failover"
version = "0.1.0"
description = "Stateless, inference-only failover frontend for Coire Studios."
requires-python = "==3.13.*"
dependencies = [
    "coire-core",
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    # MIT. Bound authenticated requests to local node relay only; pinned for release reproducibility.
    "httpx==0.28.1",
    # MIT. Validate Cloudflare Access identity against the snapshot's pinned issuer/audience.
    "PyJWT[crypto]==2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_failover"]

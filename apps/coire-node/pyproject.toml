[project]
name = "coire-node"
version = "0.1.0"
description = "Coire node agent: runs natively on each Studio under launchd."
requires-python = "==3.13.*"
dependencies = [
    "coire-core",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psutil>=6.1",
    "httpx>=0.28",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
]

[project.scripts]
coire-node = "coire_node.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_node"]

[project]
name = "coire-node"
version = "0.2.0"
description = "Coire node agent: runs natively on each Studio under launchd."
requires-python = "==3.13.*"
dependencies = [
    "coire-core",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "psutil>=6.1",
    "httpx>=0.28",
    # MIT OR Apache-2.0. HTTPcore otherwise retries a missing optional backend
    # detector import on every native HTTP request (the dev graph already includes it).
    "sniffio==1.3.1",
    # HPND. Decode bounded owner image inputs in the node journal on Linux CI and Studios.
    "pillow==12.3.0",
    # Apache-2.0. Existing locked format reader validates checkpoint tensor headers
    # before MLX allocation; also available to Linux artifact/recovery contract tests.
    "safetensors==0.8.0",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    # Feature 001 (research R1, R10): the engine and the Hugging Face client. mlx is
    # Darwin-only — the Linux CI image installs coire-node without it and drives the fake
    # engine instead, so every non-engine verb is still exercised on Linux (research R9).
    "huggingface_hub[hf_xet]>=1.29",
    "mlx-lm>=0.31.3; platform_system=='Darwin'",
    # MIT. Bare visual serving on Studios only; node installer stages the locked graph.
    "mlx-vlm==0.7.3; platform_system=='Darwin'",
    # MIT. Bare image generation on Studios; model assets require separate admin licence review.
    "mflux==0.20.0; platform_system=='Darwin'",
    # BSD-3-Clause. Transformers 5's Idefics3 AutoProcessor needs the Torchvision backend
    # even when its local PIL processor exists; keep this off core and Linux CI.
    "torchvision; platform_system=='Darwin'",
]

[project.scripts]
coire-node = "coire_node.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_node"]

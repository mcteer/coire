[project]
name = "coire-file-worker"
version = "0.1.0"
description = "Isolated CPU-only PDF and still-image preprocessing for Coire chat."
requires-python = "==3.13.*"
dependencies = [
    "coire-core",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # Apache-2.0. Emit low-cardinality processing spans and counters.
    "opentelemetry-api==1.44.0",
    # Apache-2.0/BSD-3-Clause plus bundled PDFium notices. Unicode extraction and page render.
    "pypdfium2==5.13.0",
    # MIT-CMU. Decode, orient, normalize, and strip still-image metadata.
    "Pillow==12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_file_worker"]

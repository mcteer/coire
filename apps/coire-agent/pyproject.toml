[project]
name = "coire-agent"
version = "0.1.0"
description = "Coire agent harness image. Built in feature 000; the harness itself is feature 010."
requires-python = "==3.13.*"
dependencies = ["coire-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_agent"]

[project]
name = "coire-agent"
version = "0.1.0"
description = "Coire agent harness image. Built in feature 000; the harness itself is feature 010."
requires-python = "==3.13.*"
dependencies = [
    "coire-core",
    "pydantic-ai-slim[openai]==2.37.0",
]

[project.optional-dependencies]
# MIT. The long-lived ops-only distribution exposes a narrow internal HTTP/health boundary;
# keeping these optional prevents either server dependency from entering the Studio user image.
ops = [
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_agent"]

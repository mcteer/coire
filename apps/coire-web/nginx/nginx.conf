# nginx is the sole ingress (FR-008). It serves the built SPA and reverse-proxies the API.
#
# Every writable path is under /tmp because the container runs with a read-only root
# filesystem and a tmpfs at /tmp (image-policy rule 4).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # Docker's embedded DNS. Upstreams are referenced through variables so nginx resolves
    # them per request rather than at startup: with a static `upstream` block, nginx refuses
    # to start whenever a backend is unresolvable, which would mean a coire-api outage could
    # also prevent coire-web from restarting (spec SC-002).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Local liveness for this container's own HEALTHCHECK.
        #
        # Deliberately NOT proxied: probing /ready here would reach coire-api, so every api
        # restart would mark coire-web unhealthy and break the restart-isolation guarantee
        # (spec SC-002).
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Streaming paths. Buffering must stay off: SSE token streams pass through here, and
        # a buffering proxy would hold tokens until the buffer fills.
        location /v1/ {
            set $api_upstream http://coire-api:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /mcp/ {
            set $mcp_upstream http://coire-mcp:8001;
            proxy_pass $mcp_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location ~ ^/(health|ready|api)(/|$) {
            set $api_upstream http://coire-api:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

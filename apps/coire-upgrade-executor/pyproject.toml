[project]
name = "coire-upgrade-executor"
version = "0.1.0"
description = "Independent fixed-operation control-plane recovery owner."
requires-python = "==3.13.*"
dependencies = [
    "coire-core",
    # MIT / BSD-3-Clause: existing locked HTTP service libraries; one worker, no shell.
    "fastapi==0.135.1",
    "uvicorn==0.41.0",
    "httpx==0.28.1",
    # Apache-2.0: existing locked local OTLP instrumentation and exporters.
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
]

[project.scripts]
coire-upgrade-executor = "coire_upgrade_executor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_upgrade_executor"]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pin-check
        name: images are digest-pinned
        entry: scripts/pin-images.sh --check
        language: system
        files: '(compose\.yaml|Dockerfile|images\.lock)$'
        pass_filenames: false

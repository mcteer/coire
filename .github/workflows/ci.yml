name: CI

# Native arm64 runners throughout. The image that runs on core is the image CI tests — no
# QEMU, no amd64 build, and therefore no "works on the runner, fails on the Mac" gap.
# Linux arm64 runners are generally available and free for public repositories.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  UV_VERSION: "0.12.7"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy --strict
        run: uv run mypy apps/ packages/
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/coire-web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/coire-web
      - run: npx tsc --noEmit
        working-directory: apps/coire-web
      - run: npx eslint .
        working-directory: apps/coire-web

  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: pytest (unit and contract)
        run: uv run pytest -m "not integration" -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/coire-web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/coire-web
      - run: npx vitest run
        working-directory: apps/coire-web

  pin-check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: every image reference is digest-pinned
        run: scripts/pin-images.sh --check

  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      # Several simultaneous anonymous GHCR uv-base pulls hit registry HTTP 429.
      max-parallel: 2
      matrix:
        include:
          - name: coire-api
            dockerfile: apps/coire-api/docker/api.Dockerfile
          - name: coire-mcp
            dockerfile: apps/coire-api/docker/mcp.Dockerfile
          - name: coire-scheduler
            dockerfile: apps/coire-api/docker/scheduler.Dockerfile
          - name: coire-file-worker
            dockerfile: apps/coire-file-worker/Dockerfile
          - name: coire-migrate
            dockerfile: apps/coire-api/docker/migrate.Dockerfile
          - name: coire-agent
            dockerfile: apps/coire-agent/Dockerfile
          - name: coire-agent-ops
            dockerfile: apps/coire-agent/ops.Dockerfile
          - name: coire-run-relay
            dockerfile: apps/coire-node/run-relay.Dockerfile
          - name: coire-web
            dockerfile: apps/coire-web/Dockerfile
          - name: coire-otel
            dockerfile: deploy/compose/otel.Dockerfile
          - name: coire-prometheus
            dockerfile: deploy/compose/prometheus.Dockerfile
          - name: coire-alertmanager
            dockerfile: deploy/compose/alertmanager.Dockerfile
          - name: coire-loki
            dockerfile: deploy/compose/loki.Dockerfile
          - name: coire-tempo
            dockerfile: deploy/compose/tempo.Dockerfile
          - name: coire-grafana
            dockerfile: deploy/compose/grafana.Dockerfile
          - name: coire-failover
            dockerfile: apps/coire-failover/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (native arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          tags: ${{ matrix.name }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: image policy (contracts/image-policy.md rules 1-7)
        run: scripts/image-policy.sh ${{ matrix.name }}:ci ${{ matrix.dockerfile }}

      - name: CVE scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          # `table` so a failure names the CVE and the package in the job log (spec US3).
          format: table

      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ matrix.name }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: save image for the integration job
        run: docker save ${{ matrix.name }}:ci -o /tmp/${{ matrix.name }}.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.tar
          retention-days: 1

  integration:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # The drained-binary gate exports the reviewed 016 revision read-only.
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true
      - name: load images
        run: for t in /tmp/images/*.tar; do docker load -i "$t"; done
      # docker save/load preserves image IDs but not RepoDigests on Linux. Push the two
      # run images through a loopback registry so tests use production-shaped immutable
      # name@sha256 references rather than mutable CI tags.
      - name: assign run-image repository digests
        run: |
          docker run -d --name coire-ci-registry -p 127.0.0.1:5000:5000 \
            docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null && break
            if [ "$attempt" -eq 20 ]; then
              docker logs coire-ci-registry
              exit 1
            fi
            sleep 1
          done
          for image in coire-agent coire-run-relay; do
            docker tag "${image}:ci" "localhost:5000/${image}:ci"
            docker push "localhost:5000/${image}:ci"
          done
      # Built here rather than in the build matrix: this image is CI-only, is exempt from the
      # image policy by name, and is never published (research R9).
      - name: build the CI node image
        run: |
          docker build -q -f apps/coire-node/docker/node-test.Dockerfile \
            -t coire-node-test:ci .
      - name: bring up and validate
        env:
          COIRE_TAG: ci
          COIRE_SECRETS_DIR: ${{ runner.temp }}/coire-secrets
          # Optional. The acquisition test uses an ungated repository, so it passes without a
          # token; set the secret only if a gated repository is ever needed. It reaches
          # node-a alone, which the FR-005 test asserts.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          export COIRE_SECRET_POSTGRES_PASSWORD="$(openssl rand -base64 24)"
          export COIRE_SECRET_KEY_SIGNING_SECRET="$(openssl rand -base64 32)"
          COIRE_INTEGRATION=1 uv run pytest -m integration -q
      - name: prove the token reached only the acquisition node
        if: always()
        working-directory: deploy/compose
        run: |
          docker compose -p coire-it config --format json \
            | python3 -c "
          import json, sys
          services = json.load(sys.stdin)['services']
          leaked = [
              name for name, svc in services.items()
              if name != 'node-a'
              and any('HF' in k.upper() for k in (svc.get('environment') or {}))
          ]
          print('services carrying an HF variable:', leaked or 'none besides node-a')
          raise SystemExit(1 if leaked else 0)
          " || true
      - name: control-plane state on failure
        if: failure()
        working-directory: deploy/compose
        env:
          COIRE_SECRETS_DIR: ${{ runner.temp }}/coire-secrets
        run: |
          docker compose -p coire-it ps -a || true
          docker compose -p coire-it logs --no-color --tail=100 || true
      - name: remove the ephemeral registry
        if: always()
        run: docker rm -f coire-ci-registry || true

  # The engine only runs on Apple Silicon, so the one thing the Linux job cannot prove -
  # that a real mlx_lm.server loads, serves, and is measured correctly - is proven here
  # (research R9). Informational until it has been green three times on main; it is added to
  # the required checks after that.
  engine:
    needs: lint
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --package coire-node --frozen
      - name: give the runner a mesh-subnet address
        # The agent binds its mesh address, exactly as it does on a Studio, and
        # NodeRegistration refuses anything outside 192.168.100.0/24.
        run: sudo ifconfig lo0 alias 192.168.100.11 255.255.255.0
      - name: cache the test model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen2.5-0.5b-4bit-v1
      - name: real engine tests
        env:
          COIRE_ENGINE: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest -m engine apps/coire-node/tests/engine --ignore=apps/coire-node/tests/engine/test_real_image_worker.py -q
      - name: record the measurements
        if: always()
        run: |
          if [ -f engine-measurements.md ]; then
            cat engine-measurements.md >> "$GITHUB_STEP_SUMMARY"
          fi

  evaluation-engine:
    needs: lint
    runs-on: macos-15
    env:
      COIRE_EVALUATION_ENGINE: "1"
      COIRE_TRAINING_ENGINE: "1"
      COIRE_TEST_MODEL: ${{ github.workspace }}/models/mlx-community--Qwen2.5-Coder-0.5B-Instruct-4bit
      COIRE_TEST_JUDGE: ${{ github.workspace }}/models/mlx-community--Qwen2.5-Coder-1.5B-Instruct-4bit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: isolated metadata database binaries
        run: |
          brew install postgresql@17
          echo "COIRE_TEST_POSTGRES_BIN=$(brew --prefix postgresql@17)/bin" >> "$GITHUB_ENV"
      - name: acquire and verify isolated tiny evaluation assets
        run: uv run python tests/integration/build_evaluation_fixture.py
      - name: real offline evaluation generation gate
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          uv run pytest -q -rs
          tests/integration/test_evaluation_suites.py
          tests/integration/test_evaluation_training.py
          apps/coire-node/tests/engine/test_training_resume.py

  image-engine:
    needs: lint
    runs-on: macos-15
    env:
      COIRE_TEST_MODEL: ${{ github.workspace }}/models/test--image-tiny
      COIRE_ENGINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --package coire-node --frozen
      - name: build ignored tiny image fixture
        run: uv run python apps/coire-node/tests/engine/build_tiny_image_fixture.py
      - name: real offline image worker and lifecycle gate
        run: uv run pytest -q -rs apps/coire-node/tests/engine/test_real_image_worker.py

  preference-engine:
    needs: lint
    runs-on: macos-15
    env:
      COIRE_TRAINING_ENGINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: isolated tiny acquisition and node-owned dense conversion
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: uv run python tests/integration/build_preference_fixture.py
      - name: real objective, initialization, worker, measurement and restart matrix
        run: |
          for suffix in '' '.preference-dense-bf16'; do
            export COIRE_TEST_MODEL="$GITHUB_WORKSPACE/models/mlx-community--Qwen2.5-Coder-0.5B-Instruct-4bit${suffix}"
            uv run pytest -q -rs \
              apps/coire-node/tests/engine/test_preference_loss.py \
              apps/coire-node/tests/engine/test_preference_runtime.py \
              apps/coire-node/tests/engine/test_preference_resume.py \
              apps/coire-node/tests/engine/test_preference_probe.py \
              apps/coire-node/tests/engine/test_preference_worker.py \
              apps/coire-node/tests/engine/test_preference_measurement.py
          done

  publish:
    # Only tagged releases publish. Pull requests never push an image.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build, integration, pin-check, image-engine, evaluation-engine, preference-engine]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        name: [coire-api, coire-mcp, coire-scheduler, coire-file-worker, coire-migrate, coire-agent, coire-agent-ops, coire-run-relay, coire-web, coire-otel, coire-prometheus, coire-alertmanager, coire-loki, coire-tempo, coire-grafana, coire-failover]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.name }}
          path: /tmp
      - name: push and record the digest
        run: |
          docker load -i /tmp/${{ matrix.name }}.tar
          REF="${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${GITHUB_REF_NAME}"
          docker tag ${{ matrix.name }}:ci "$REF"
          docker push "$REF"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$REF")"
          # The images.lock line for this release, ready to paste on core.
          echo "${{ matrix.name }} $DIGEST" >> "$GITHUB_STEP_SUMMARY"

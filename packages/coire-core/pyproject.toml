[project]
name = "coire-core"
version = "0.1.0"
description = "Shared Pydantic wire shapes, settings, and the mesh-first client for Coire."
requires-python = "==3.13.*"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    # Apache-2.0/BSD. Ed25519 verification for signed failover snapshots and peer votes.
    "cryptography==50.0.1",
    "opentelemetry-api>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coire_core"]
